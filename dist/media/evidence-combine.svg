<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">EvidenceCombine evidence workspace concept</title>
  <desc id="desc">A case workspace that brings documents, evidence items and review status together.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171c1a"/><stop offset="1" stop-color="#252b24"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bcd19d"/><stop offset="1" stop-color="#91a87d"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <path d="M0 96H1200M0 674H1200" stroke="#3b4338"/>
  <g font-family="Arial, sans-serif">
    <text x="58" y="54" fill="#a7b19e" font-size="13" letter-spacing="3">EVIDENCE WORKSPACE / CONCEPT</text>
    <text x="58" y="158" fill="#e9ecdf" font-size="56" font-weight="600">EvidenceCombine</text>
    <text x="61" y="197" fill="#abb2a3" font-size="18">从分散材料，到可复核的事实结构。</text>
    <rect x="58" y="245" width="1084" height="360" rx="4" fill="#111514" stroke="#3b443c"/>
    <rect x="58" y="245" width="1084" height="48" fill="#1b211d"/>
    <circle cx="82" cy="269" r="4" fill="#c38b67"/><circle cx="98" cy="269" r="4" fill="#b2c896"/><circle cx="114" cy="269" r="4" fill="#697b63"/>
    <text x="143" y="274" fill="#abb4a7" font-size="12">CASE / 2026-014</text>
    <text x="84" y="335" fill="#8c9a86" font-size="11" letter-spacing="1.5">MATERIALS</text>
    <text x="478" y="335" fill="#8c9a86" font-size="11" letter-spacing="1.5">EVIDENCE ITEMS</text>
    <text x="858" y="335" fill="#8c9a86" font-size="11" letter-spacing="1.5">REVIEW</text>
    <g fill="#1b211d" stroke="#3a443b">
      <rect x="82" y="356" width="310" height="53" rx="3"/><rect x="82" y="419" width="310" height="53" rx="3"/><rect x="82" y="482" width="310" height="53" rx="3"/>
      <rect x="463" y="356" width="322" height="53" rx="3"/><rect x="463" y="419" width="322" height="53" rx="3"/><rect x="463" y="482" width="322" height="53" rx="3"/>
      <rect x="839" y="356" width="276" height="179" rx="3"/>
    </g>
    <g fill="#d7ddcf" font-size="14"><text x="98" y="388">01 / 合同与往来邮件.pdf</text><text x="98" y="451">02 / 项目沟通记录.docx</text><text x="98" y="514">03 / 会议纪要与附件.zip</text><text x="481" y="388">权利归属与授权范围</text><text x="481" y="451">关键时间节点</text><text x="481" y="514">待核对事实 / 责任主体</text></g>
    <g stroke="#849477" stroke-width="1.5" fill="none"><path d="M401 382H451M401 445H451M401 508H451"/><path d="M393 382l8-5v10zm0 63l8-5v10zm0 63l8-5v10z" fill="#849477"/><path d="M794 382H826M794 445H826M794 508H826"/></g>
    <rect x="858" y="378" width="11" height="11" fill="url(#accent)"/><text x="882" y="388" fill="#cbd6bd" font-size="13">来源已关联</text>
    <rect x="858" y="416" width="11" height="11" fill="#bc8868"/><text x="882" y="426" fill="#cbd6bd" font-size="13">需要人工复核</text>
    <rect x="858" y="454" width="11" height="11" fill="#728471"/><text x="882" y="464" fill="#cbd6bd" font-size="13">事实待补充</text>
    <text x="60" y="713" fill="#8c9787" font-size="12" letter-spacing="1">COLLECT  /  ORGANIZE  /  VERIFY</text>
    <text x="1140" y="713" text-anchor="end" fill="#8c9787" font-size="12">GITHUB PROJECT</text>
